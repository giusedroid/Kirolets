services:
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  bot:
    build: .
    restart: unless-stopped
    command: kirolets-bot
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

  worker:
    build: .
    restart: unless-stopped
    command: kirolets-worker
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      QUEUE_WORKER_CONCURRENCY: 1
    depends_on:
      - redis

volumes:
  redis-data:
